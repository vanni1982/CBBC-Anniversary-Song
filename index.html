<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBBC Anniversary Song</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #1d1d1f;
        }
        .hero-section {
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 60px 20px 45px 20px;
            min-height: 85vh;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .hero-section.dark-theme {
            background-color: #000000;
            color: #f5f5f7;
        }
        .hero-section.dark-theme .hero-subtitle {
            color: #a1a1a6;
        }
        .hero-section.white-theme {
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin-bottom: 20px;
        }
        .hero-title {
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        .hero-subtitle {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.3;
            color: #1d1d1f;
            margin-bottom: 28px;
        }
        .cta-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .btn {
            text-decoration: none;
            font-size: 1.05rem;
            padding: 12px 28px;
            border-radius: 980px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            font-weight: 500;
            min-width: 120px;
        }
        .btn-primary {
            background-color: #0071e3;
            color: #ffffff;
            border: 1px solid #0071e3;
        }
        .btn-primary:hover {
            background-color: #0077ed;
        }
        .btn-outline {
            background-color: transparent;
            color: #0071e3;
            border: 1px solid #0071e3;
        }
        .btn-outline:hover {
            background-color: #0071e3;
            color: #ffffff;
        }
        .dark-theme .btn-outline {
            color: #2997ff;
            border-color: #2997ff;
        }
        .dark-theme .btn-outline:hover {
            background-color: #2997ff;
            color: #ffffff;
        }
        .hero-video-container {
            position: relative;
            width: 100%;
            max-width: 750px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            border-radius: 16px;
        }
        .fullscreen-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(29, 29, 31, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
            z-index: 10;
        }
        .fullscreen-btn:hover {
            background-color: rgba(29, 29, 31, 0.9);
            transform: scale(1.06);
        }
        .fullscreen-btn svg {
            width: 18px;
            height: 18px;
        }
        .fade-in {
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s ease forwards;
        }
        .fade-in-delayed {
            opacity: 0;
            transform: translateY(25px);
            animation: fadeInUp 0.8s ease 0.2s forwards;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 600px) {
            .hero-section { padding: 50px 16px 35px 16px; }
            .hero-title { font-size: 2.5rem; }
            .hero-subtitle { font-size: 1.2rem; }
            .cta-buttons { flex-direction: row; gap: 12px; }
            .btn { padding: 10px 22px; font-size: 0.95rem; min-width: 105px; }
            .fullscreen-btn { width: 36px; height: 36px; bottom: 12px; right: 12px; }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-content fade-in">
            <h1 class="hero-title">CBBC Anniversary Song</h1>
            <p class="hero-subtitle">Soprano Alto Tenor Bass<br>Choir</p>
            <div class="cta-buttons">
                <button class="btn btn-primary play-pause-btn">Pause</button>
                <button class="btn btn-outline mute-unmute-btn">Unmute</button>
            </div>
        </div>
        <div class="hero-video-container fade-in-delayed">
            <video class="hero-video" autoplay loop muted playsinline>
                <source src="video2.mp4" type="video/mp4">
            </video>
            <button class="fullscreen-btn" title="Fullscreen" aria-label="Fullscreen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
        </div>
    </section>

    <section class="hero-section dark-theme">
        <div class="hero-content">
            <h1 class="hero-title">Conquering<br>More Mountains</h1>
            <p class="hero-subtitle">Instrumental + Lyrics</p>
            <div class="cta-buttons">
                <button class="btn btn-primary play-pause-btn">Pause</button>
                <button class="btn btn-outline mute-unmute-btn">Unmute</button>
            </div>
        </div>
        <div class="hero-video-container">
            <video class="hero-video" autoplay loop muted playsinline>
                <source src="video1.mp4" type="video/mp4">
            </video>
            <button class="fullscreen-btn" title="Fullscreen" aria-label="Fullscreen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
        </div>
    </section>

    <section class="hero-section white-theme">
        <div class="hero-content">
            <h1 class="hero-title">Conquering<br>More Mountains</h1>
            <p class="hero-subtitle">Vocal Guide | Tenor</p>
            <div class="cta-buttons">
                <button class="btn btn-primary play-pause-btn">Pause</button>
                <button class="btn btn-outline mute-unmute-btn">Unmute</button>
            </div>
        </div>
        <div class="hero-video-container">
            <video class="hero-video" autoplay loop muted playsinline>
                <source src="video3.mp4" type="video/mp4">
            </video>
            <button class="fullscreen-btn" title="Fullscreen" aria-label="Fullscreen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const sections = document.querySelectorAll(".hero-section");

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    const video = entry.target.querySelector(".hero-video");
                    const playPauseBtn = entry.target.querySelector(".play-pause-btn");
                    const muteUnmuteBtn = entry.target.querySelector(".mute-unmute-btn");

                    if (!entry.isIntersecting) {
                        if (!video.muted) {
                            video.muted = true;
                            muteUnmuteBtn.textContent = "Unmute";
                        }
                        if (!video.paused) {
                            video.pause();
                            playPauseBtn.textContent = "Play";
                        }
                    } else {
                        if (video.paused && video.dataset.userPaused !== "true") {
                            video.play().catch(() => {});
                            playPauseBtn.textContent = "Pause";
                        }
                    }
                });
            }, { threshold: 0.25 });

            sections.forEach((section) => {
                observer.observe(section);

                const video = section.querySelector(".hero-video");
                const playPauseBtn = section.querySelector(".play-pause-btn");
                const muteUnmuteBtn = section.querySelector(".mute-unmute-btn");
                const fullscreenBtn = section.querySelector(".fullscreen-btn");

                playPauseBtn.addEventListener("click", () => {
                    if (video.paused) {
                        video.play();
                        video.dataset.userPaused = "false";
                        playPauseBtn.textContent = "Pause";
                    } else {
                        video.pause();
                        video.dataset.userPaused = "true";
                        playPauseBtn.textContent = "Play";
                    }
                });

                muteUnmuteBtn.addEventListener("click", () => {
                    if (video.muted) {
                        sections.forEach((otherSection) => {
                            const otherVideo = otherSection.querySelector(".hero-video");
                            const otherBtn = otherSection.querySelector(".mute-unmute-btn");
                            otherVideo.muted = true;
                            otherBtn.textContent = "Unmute";
                        });
                        video.muted = false;
                        muteUnmuteBtn.textContent = "Mute";
                    } else {
                        video.muted = true;
                        muteUnmuteBtn.textContent = "Unmute";
                    }
                });

                fullscreenBtn.addEventListener("click", () => {
                    if (video.requestFullscreen) {
                        video.requestFullscreen();
                    } else if (video.webkitRequestFullscreen) {
                        video.webkitRequestFullscreen();
                    } else if (video.webkitEnterFullscreen) {
                        video.webkitEnterFullscreen();
                    } else if (video.msRequestFullscreen) {
                        video.msRequestFullscreen();
                    }
                });
            });
        });
    </script>

</body>
</html>
